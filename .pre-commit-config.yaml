repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline", "--exclude-files", "^(PRD\\.md|.*\\.dvc|dvc\\.lock)$"]
  - repo: local
    hooks:
      - id: commit-msg-policy
        name: commit message policy
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
