[project]
name = "breachlab"
license = { text = "Apache-2.0" }
version = "0.1.0"
description = "BreachLab: jailbreak gauntlet game with a fine-tuned guard model (research demo)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "mlflow-skinny>=2.14",
  "rich>=13",
  "numpy>=1.26",
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
  "detect-secrets>=1.5",
  "hypothesis>=6",
]
data = [
    "tokenizers>=0.19",
    "pandas>=2",
    "pandera>=0.19",
    "datasketch>=1.6",
    "datasets>=2.20",
    "scikit-learn>=1.9.1",
]
cloud = ["modal[api-proxy-support]>=0.64", "dvc[s3]>=3.50", "kaggle>=1.7.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breachlab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mlflow.*", "modal.*", "datasketch.*", "pandas.*", "pandera.*", "torch.*", "peft.*", "transformers.*", "trl.*", "datasets.*", "onnxruntime.*", "huggingface_hub.*", "tokenizers.*", "kaggle.*", "optimum.*", "sklearn.*", "onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=breachlab --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/breachlab"]
omit = ["*/modal_*.py"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
