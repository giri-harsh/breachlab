name: linkcheck
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
jobs:
  links:
    if: ${{ vars.ACTIONS_BILLING_OK == 'true' }}  # set to true only when GitHub billing works; the account lock fails every job (ADR-0103)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --python 3.11
      - run: uv run python scripts/link_check.py
