name: retrain
# Manual only (PRD 10): the continuous retraining loop is designed in docs/retraining.md, not scheduled.
on:
  workflow_dispatch:
    inputs:
      data_version:
        description: "dataset tag, e.g. data-v2"
        required: true
jobs:
  retrain:
    if: ${{ vars.ACTIONS_ENABLED == 'true' }}  # off until the GitHub account billing lock is fixed (ADR-0103)
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --python 3.11
      - name: push the training kernel (Kaggle T4; Modal when available)
        run: uv run python -m breachlab.train.kaggle_job --data data/processed/${{ inputs.data_version }} --slug breachlab-retrain-${{ inputs.data_version }} --stage train
