name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    if: ${{ vars.ACTIONS_BILLING_OK == 'true' }}  # set to true only when GitHub billing works; the account lock fails every job (ADR-0103)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --python 3.11
      - name: no AI attribution trailers in new commits
        run: uv run python scripts/check_no_ai_trailers.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/check_readme_numbers.py
      - name: eval gate on the stored candidate evaluation (advisory until CPU latency is verified, ADR-0036)
        continue-on-error: true
        run: uv run python scripts/eval_gate.py reports/gate-input.json
  web:
    if: ${{ vars.ACTIONS_BILLING_OK == 'true' }}  # set to true only when GitHub billing works; the account lock fails every job (ADR-0103)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  docker:
    if: ${{ vars.ACTIONS_BILLING_OK == 'true' }}  # set to true only when GitHub billing works; the account lock fails every job (ADR-0103)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t breachlab-gateway .
  cloud-smoke:
    if: ${{ vars.ACTIONS_BILLING_OK == 'true' }}  # set to true only when GitHub billing works; the account lock fails every job (ADR-0103)
    runs-on: ubuntu-latest
    needs: checks
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --python 3.11
      - name: dvc push
        if: env.DAGSHUB_TOKEN != ''
        run: |
          uv run dvc remote modify --local origin auth basic
          uv run dvc remote modify --local origin user "$MLFLOW_TRACKING_USERNAME"
          uv run dvc remote modify --local origin password "$DAGSHUB_TOKEN"
          uv run dvc push
      - name: mlflow test run
        if: env.MLFLOW_TRACKING_URI != ''
        run: uv run python scripts/mlflow_test_run.py
      - name: skipped notice
        if: env.MLFLOW_TRACKING_URI == '' || env.DAGSHUB_TOKEN == ''
        run: echo "::warning::cloud smoke skipped - secrets not configured (BLOCKER)"
